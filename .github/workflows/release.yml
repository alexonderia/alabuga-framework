name: Framework release
on:
  push:
    tags: ['v*']
permissions: {contents: write}
concurrency: {group: framework-release, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: framework-release
    env:
      ALABUGA_NPM_REGISTRY: ${{ vars.ALABUGA_NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version, registry-url: '${{ vars.ALABUGA_NPM_REGISTRY }}'}
      - run: npm install --global npm@11.17.0
      - run: node scripts/configure-registry.mjs "$ALABUGA_NPM_REGISTRY"
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build && npm test && npm run test:package && npm run test:consumers
      - run: npm run build:docs && npm run check:docs
      - run: npm run test:browser -- --workers=1
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FRAMEWORK_PUBLISH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: {name: framework-package, path: artifacts/package/}
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({owner:context.repo.owner,repo:context.repo.repo,tag_name:context.ref.replace('refs/tags/',''),generate_release_notes:true});

  backup:
    needs: release
    uses: ./.github/workflows/registry-backup.yml
    secrets: inherit
