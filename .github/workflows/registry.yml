name: Registry configuration
on:
  workflow_dispatch:
  pull_request:
    paths: ['infra/registry/**']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    env: {REGISTRY_DOMAIN: npm.example.org}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p infra/registry/secrets && touch infra/registry/secrets/htpasswd
      - run: docker compose -f infra/registry/compose.yaml config --quiet
      - run: bash -n infra/registry/*.sh
