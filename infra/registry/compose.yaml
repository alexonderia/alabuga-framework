name: alabuga-registry
services:
  registry:
    extends:
      file: ../../compose.yaml
      service: registry
    environment:
      VERDACCIO_PUBLIC_URL: https://${REGISTRY_DOMAIN:?Set REGISTRY_DOMAIN}
    ports: !reset []
  proxy:
    extends:
      file: ../../compose.yaml
      service: proxy
    profiles: !reset []
    environment:
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN:?Set REGISTRY_DOMAIN}
  certbot:
    extends:
      file: ../../compose.yaml
      service: certbot
volumes:
  storage:
    name: ${REGISTRY_STORAGE_VOLUME:-${COMPOSE_PROJECT_NAME:-alabuga-registry}_storage}
  certificates:
    name: ${REGISTRY_CERTIFICATES_VOLUME:-${COMPOSE_PROJECT_NAME:-alabuga-registry}_certificates}
  challenges:
    name: ${REGISTRY_CHALLENGES_VOLUME:-${COMPOSE_PROJECT_NAME:-alabuga-registry}_challenges}
