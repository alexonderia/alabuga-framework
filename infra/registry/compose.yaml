name: alabuga-registry
services:
  registry:
    image: verdaccio/verdaccio:6.10.3@sha256:7b067a47ae51fb9dff3dcdce60ec0a2cbd7650c208cb4b9f6d37cb1b09b39d43
    restart: unless-stopped
    environment:
      VERDACCIO_PUBLIC_URL: https://${REGISTRY_DOMAIN:?Set REGISTRY_DOMAIN}
    volumes:
      - storage:/verdaccio/storage
      - ./config.yaml:/verdaccio/conf/config.yaml:ro
      - ./secrets/htpasswd:/verdaccio/conf/htpasswd:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4873/-/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN:?Set REGISTRY_DOMAIN}
      NGINX_ENVSUBST_FILTER: REGISTRY_DOMAIN
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - challenges:/var/www/acme:ro
    depends_on:
      registry: {condition: service_healthy}
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [maintenance]
    volumes: [certificates:/etc/letsencrypt, challenges:/var/www/acme]
volumes:
  storage:
  certificates:
  challenges:
