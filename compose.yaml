name: alabuga-framework

services:
  docs:
    image: ${AF_DOCS_IMAGE:-alabuga-framework-docs:local}
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        CONSTRUCTOR_URL: ${CONSTRUCTOR_URL:-http://127.0.0.1:4176}
    ports: ["127.0.0.1:${AF_DOCS_PORT:-4391}:80"]
    restart: unless-stopped

  registry:
    image: verdaccio/verdaccio:6.10.3@sha256:7b067a47ae51fb9dff3dcdce60ec0a2cbd7650c208cb4b9f6d37cb1b09b39d43
    restart: unless-stopped
    environment:
      VERDACCIO_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://127.0.0.1:${AF_REGISTRY_PORT:-4873}}
    ports: ["127.0.0.1:${AF_REGISTRY_PORT:-4873}:4873"]
    volumes:
      - storage:/verdaccio/storage
      - ./infra/registry/config.yaml:/verdaccio/conf/config.yaml:ro
      - ./infra/registry/secrets/htpasswd:/verdaccio/conf/htpasswd:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4873/-/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.28.0-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      REGISTRY_DOMAIN: ${REGISTRY_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: REGISTRY_DOMAIN
    volumes:
      - ./infra/registry/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - challenges:/var/www/acme:ro
    depends_on:
      registry: {condition: service_healthy}

  certbot:
    image: certbot/certbot:v4.0.0
    profiles: [maintenance]
    volumes: [certificates:/etc/letsencrypt, challenges:/var/www/acme]

volumes:
  # Reuse the existing registry volumes when switching to the combined stack.
  storage:
    name: ${REGISTRY_STORAGE_VOLUME:-alabuga-registry-local_storage}
  certificates:
    name: ${REGISTRY_CERTIFICATES_VOLUME:-alabuga-registry_certificates}
  challenges:
    name: ${REGISTRY_CHALLENGES_VOLUME:-alabuga-registry_challenges}
